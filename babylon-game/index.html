    ctx.fillStyle = "rgba(0,0,0,.28)"; ctx.beginPath(); ctx.ellipse(x + w * .12, y + h * .38, w * .62, h * .3, 0, 0, 7); ctx.fill();
    const n = 10, pts = []; for (let k = 0; k < n; k++) { const a = k / n * 6.283, j = rr(0.84, 1.08); pts.push([x + Math.cos(a) * w * .5 * j, y + Math.sin(a) * h * .5 * j]); }
    ctx.beginPath(); pts.forEach((p, k) => { const q = pts[(k + 1) % n], mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2; k ? ctx.quadraticCurveTo(p[0], p[1], mx, my) : ctx.moveTo(mx, my); });
    ctx.closePath();
    const g = ctx.createRadialGradient(x - w * .22, y - h * .28, 0, x, y, w * .65);
    g.addColorStop(0, "#d3d5d9"); g.addColorStop(.55, "#9a9da4"); g.addColorStop(1, "#6a6d74");
    ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = .5 * u; ctx.strokeStyle = "rgba(50,52,58,.8)"; ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = .6 * u; ctx.beginPath(); ctx.arc(x, y, w * .36, 3.5, 4.5); ctx.stroke();
    ctx.strokeStyle = "rgba(60,62,68,.5)"; ctx.lineWidth = .3 * u; ctx.beginPath(); ctx.moveTo(x + w * .05, y - h * .1); ctx.lineTo(x + w * .18, y + h * .12); ctx.stroke();
  };
  for (let i = 0; i < 16; i++) {                        // einzelne größere Steine
    const w = rr(11, 24) * u; stone(rr(20, STAGE_W - 20) * u, rr(20, STAGE_H - 20) * u, w, w * rr(0.6, 0.8));
  }
  for (let c = 0; c < 9; c++) {                         // Kiesel-Gruppen
    const cx = rr(20, STAGE_W - 20) * u, cy = rr(20, STAGE_H - 20) * u;
    for (let k = 0, m = 3 + ((R() * 4) | 0); k < m; k++) { const w = rr(4, 8) * u; stone(cx + rr(-9, 9) * u, cy + rr(-6, 6) * u, w, w * rr(0.6, 0.85)); }
  }
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * .85);   // dezente Randabdunkelung
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,30,10,.30)"); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}
{
  const k = Math.min(6, Math.floor(Math.min(engine.getCaps().maxTextureSize || 4096, 8192) / STAGE_W));
  const tex = new BABYLON.DynamicTexture("grass", { width: STAGE_W * k, height: STAGE_H * k }, scene, true, BABYLON.Texture.TRILINEAR_SAMPLINGMODE);
  drawGrass(tex.getContext(), STAGE_W * k, STAGE_H * k); tex.update(true); tex.anisotropicFilteringLevel = 16;
  stageMat.diffuseTexture = tex;
}

function dynTex(w, h) { return new BABYLON.DynamicTexture("t", { width: w, height: h }, scene, true, BABYLON.Texture.TRILINEAR_SAMPLINGMODE); }
function finishTex(t) { t.update(true); t.anisotropicFilteringLevel = 16; t.wrapU = t.wrapV = BABYLON.Texture.CLAMP_ADDRESSMODE; return t; }

const shadowTex = dynTex(256, 256);
{ const ctx = shadowTex.getContext(), g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, "rgba(0,0,0,0.30)"); g.addColorStop(1, "rgba(0,0,0,0)"); ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256); shadowTex.update(); }
const shadowMat = makeMaterial(shadowTex);

// Wassertropfen mit bösem Gesicht, in hoher Auflösung gezeichnet
function drawWater(ctx, W, H) {
  const sx = W / 48, sy = H / 60; ctx.save(); ctx.scale(sx, sy);
  ctx.beginPath(); ctx.moveTo(24, 2);
  ctx.bezierCurveTo(30, 16, 45, 26, 45, 38); ctx.bezierCurveTo(45, 50, 36, 58, 24, 58);
  ctx.bezierCurveTo(12, 58, 3, 50, 3, 38); ctx.bezierCurveTo(3, 26, 18, 16, 24, 2); ctx.closePath();
  const g = ctx.createLinearGradient(0, 4, 0, 58); g.addColorStop(0, "#7fd6ff"); g.addColorStop(1, "#1c7be0");
  ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 1.6; ctx.strokeStyle = "#0b4fa8"; ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.beginPath(); ctx.ellipse(14, 34, 3, 7, -0.3, 0, 7); ctx.fill();
  ctx.strokeStyle = "#08224a"; ctx.lineWidth = 2.2; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(14, 31); ctx.lineTo(21, 35); ctx.moveTo(34, 31); ctx.lineTo(27, 35); ctx.stroke();   // Augenbrauen
  ctx.fillStyle = "#08224a"; ctx.beginPath(); ctx.arc(18, 39, 2.4, 0, 7); ctx.arc(30, 39, 2.4, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(24, 49, 5, 3.6, 5.8); ctx.stroke(); ctx.restore();
}

function loadKind(def) {
  return new Promise(resolve => {
    const done = tex => {
      const s = def.size;
      def.mat = makeMaterial(tex);
      def.offX = (def.w / 2 - def.cx) * s; def.offY = -(def.h / 2 - def.cy) * s;
      def.ext = { l: def.cx * s, r: (def.w - def.cx) * s, t: def.cy * s, b: (def.h - def.cy) * s };
      resolve();
    };
    if (def.draw) { const K = 10, tex = dynTex(def.w * K, def.h * K); drawWater(tex.getContext(), def.w * K, def.h * K); done(finishTex(tex)); return; }
    const img = new Image();
    img.onload = () => {
      const K = Math.min(8, 4096 / Math.max(def.w, def.h)), tw = Math.round(def.w * K), th = Math.round(def.h * K);
      const tex = dynTex(tw, th); tex.getContext().drawImage(img, 0, 0, tw, th); done(finishTex(tex));
    };
    img.src = def.svg;
  });
}

// ---------- Spiel-Entitäten ----------
function makeEntity(kind, x, y) {
  const d = KINDS[kind], s = d.size;
  const mesh = BABYLON.MeshBuilder.CreatePlane(kind, { width: d.w * s, height: d.h * s }, scene); mesh.material = d.mat;
  const shadow = BABYLON.MeshBuilder.CreatePlane("sh", { width: d.w * s * 0.8, height: d.w * s * 0.25 }, scene); shadow.material = shadowMat;
  return { kind, d, x, y, mesh, shadow, dead: false, t: 0, seed: Math.random() * 6.28 };
}
function bounds(e) { const x = e.d.ext; return { minX: -STAGE_W / 2 + x.l, maxX: STAGE_W / 2 - x.r, minY: -STAGE_H / 2 + x.b, maxY: STAGE_H / 2 - x.t }; }
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
function body(e) { return { x: e.x + e.d.offX + e.d.body.dx, y: e.y + e.d.offY + e.d.body.dy, r: e.d.body.r }; }
function touching(a, b) { const p = body(a), q = body(b); return Math.hypot(p.x - q.x, p.y - q.y) < p.r + q.r; }
function dispose(e) { e.mesh.dispose(); e.shadow.dispose(); }

function render(e, time) {
  let sx = 1, sy = 1, vis = 1;
  if (e.kind === "fire") { sx = 1 + 0.02 * Math.sin(time * 7); sy = 1 + 0.035 * Math.sin(time * 9 + 1); }
  if (e.kind === "water") { sx = 1 + 0.05 * Math.sin(time * 8 + e.seed); sy = 1 - 0.05 * Math.sin(time * 8 + e.seed); }
  if (e.dead) { const k = clamp(1 - e.t / 0.35, 0, 1); sx *= k; sy *= k; vis = k; }
  e.mesh.scaling.set(sx, sy, 1); e.mesh.visibility = vis; e.shadow.visibility = vis;
  e.mesh.position.set(e.x + e.d.offX * sx, e.y + e.d.offY * sy, e.y * 0.001);
  e.shadow.position.set(e.x, e.y - e.d.ext.b + 4, 1 + e.y * 0.001);
}

// ---------- Eingabe ----------
const keys = new Set();
const MOVE = { up: ["ArrowUp", "KeyW"], down: ["ArrowDown", "KeyS"], left: ["ArrowLeft", "KeyA"], right: ["ArrowRight", "KeyD"] };
const held = n => MOVE[n].some(k => keys.has(k));
window.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) { keys.clear(); return; }
  if (e.code === "KeyF" && !e.repeat) { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); return; }
  if (e.code.startsWith("Arrow") || e.code === "Space") e.preventDefault();
  keys.add(e.code);
});
window.addEventListener("keyup", e => keys.delete(e.code));
window.addEventListener("blur", () => keys.clear());

// ---------- Spielzustand ----------
const $ = id => document.getElementById(id);
let wins = 0;
try { wins = parseInt(localStorage.getItem("fireWaterWins") || "0", 10) || 0; } catch (_) {}
const G = { state: "playing", timer: 0, fire: null, trees: [], waters: [], time: 0, grace: 0 };

function showMsg(kind, title, sub) { const m = $("msg"); m.className = "ui show " + kind; $("msgTitle").textContent = title; $("msgSub").textContent = sub; }
function hideMsg() { $("msg").className = "ui"; }
function updateHud() {
  $("wins").textContent = wins;
  $("trees").textContent = G.trees.filter(t => !t.dead).length;
  $("waters").textContent = G.waters.filter(w => !w.dead).length;
}

function resetGame() {
  [G.fire, ...G.trees, ...G.waters].forEach(e => e && dispose(e));
  G.trees = []; G.waters = []; G.state = "playing"; G.grace = CFG.grace; hideMsg();
  G.fire = makeEntity("fire", 0, 0);
  const placed = [{ x: 0, y: 0, d: 190 }];
  const spawn = (kind, minFire) => {
    for (let i = 0; i < 200; i++) {
      const probe = makeEntity.length && { d: KINDS[kind] }; const b = bounds(probe);
      const x = b.minX + Math.random() * (b.maxX - b.minX), y = b.minY + Math.random() * (b.maxY - b.minY);
      if (placed.every((p, j) => Math.hypot(p.x - x, p.y - y) > (j === 0 ? minFire : 80))) { placed.push({ x, y }); return makeEntity(kind, x, y); }
    }
    const x = (Math.random() - .5) * 300, y = (Math.random() - .5) * 200; placed.push({ x, y }); return makeEntity(kind, x, y);
  };
  for (let i = 0; i < CFG.trees; i++) G.trees.push(spawn("tree", 150));
  for (let i = 0; i < CFG.waters; i++) G.waters.push(spawn("water", 200));
  updateHud();
}

function endRound(result) {
  G.state = result; G.timer = CFG.endDelay;
  if (result === "won") {
    wins++; try { localStorage.setItem("fireWaterWins", String(wins)); } catch (_) {}
    showMsg("win", "Du hast gewonnen! 🔥", "Du bist als Einziger übrig. Siege: " + wins + " · nächste Runde startet gleich …");
  } else if (result === "lost") {
    showMsg("lose", "Das Wasser hat dich erwischt! 💧", "Das Spiel startet neu. Siege: " + wins);
  } else {
    G.state = "lost";
    showMsg("lose", "Keine Bäume mehr! 🌳", "Nur ein Baum kann Wasser töten. Das Spiel startet neu. Siege: " + wins);
  }
  updateHud();
}

function fleeStep(e, from, speed, dt) {
  const dx = e.x - from.x, dy = e.y - from.y, dist = Math.hypot(dx, dy);
  let ax, ay;
  if (dist < 1e-3) { const a = Math.random() * 6.28; ax = Math.cos(a); ay = Math.sin(a); } else { ax = dx / dist; ay = dy / dist; }
  const step = speed * dt, b = bounds(e);
  let nx = e.x + ax * step, ny = e.y + ay * step;
  const hitX = nx < b.minX || nx > b.maxX, hitY = ny < b.minY || ny > b.maxY;
  nx = clamp(nx, b.minX, b.maxX); ny = clamp(ny, b.minY, b.maxY);
  // Am Rand nicht festkleben: seitlich an der Wand entlang ausweichen
  if (hitX) { const dir = hitY ? -Math.sign(e.y || 1) : (Math.sign(dy) || (e.y > 0 ? -1 : 1)); ny = clamp(e.y + dir * step, b.minY, b.maxY); }
  if (hitY) { const dir = hitX ? -Math.sign(e.x || 1) : (Math.sign(dx) || (e.x > 0 ? -1 : 1)); nx = clamp(e.x + dir * step, b.minX, b.maxX); }
  e.x = nx; e.y = ny;
}
function chaseStep(e, target, speed, dt) {
  const dx = target.x - e.x, dy = target.y - e.y, d = Math.hypot(dx, dy) || 1, b = bounds(e), step = Math.min(speed * dt, d);
  e.x = clamp(e.x + dx / d * step, b.minX, b.maxX); e.y = clamp(e.y + dy / d * step, b.minY, b.maxY);
}
function nearest(e, list) {
  let best = null, bd = Infinity;
  list.forEach(o => { const d = Math.hypot(o.x - e.x, o.y - e.y); if (d < bd) { bd = d; best = o; } });
  return best && { e: best, d: bd };
}

function update(dt) {
  G.time += dt;
  const all = [G.fire, ...G.trees, ...G.waters];
  all.forEach(e => { if (e.dead) e.t += dt; });
  G.trees = G.trees.filter(e => { if (e.dead && e.t > 0.4) { dispose(e); return false; } return true; });
  G.waters = G.waters.filter(e => { if (e.dead && e.t > 0.4) { dispose(e); return false; } return true; });

  if (G.state !== "playing") {
    G.timer -= dt; if (G.timer <= 0) resetGame();
    return;
  }
  const fire = G.fire, step = CFG.fireSpeed * dt, fb = bounds(fire);
  let mx = (held("right") ? 1 : 0) - (held("left") ? 1 : 0), my = (held("up") ? 1 : 0) - (held("down") ? 1 : 0);
  if (mx && my) { mx *= Math.SQRT1_2; my *= Math.SQRT1_2; }
  fire.x = clamp(fire.x + mx * step, fb.minX, fb.maxX); fire.y = clamp(fire.y + my * step, fb.minY, fb.maxY);

  const aliveTrees = G.trees.filter(t => !t.dead), aliveWaters = G.waters.filter(w => !w.dead);
  G.grace = Math.max(0, G.grace - dt);
  // Bäume: vor dem Feuer weglaufen, sonst das nächste Wasser jagen
  aliveTrees.forEach(t => {
    if (Math.hypot(t.x - fire.x, t.y - fire.y) < CFG.fleeDistance) fleeStep(t, fire, CFG.treeSpeed, dt);
    else if (G.grace === 0) { const n = nearest(t, aliveWaters); if (n) chaseStep(t, n.e, CFG.treeSpeed, dt); }
  });

  // Wasser: rennt vor Bäumen weg, sonst greift es das Feuer an (nach kurzer Schonfrist am Rundenanfang)
  const speed = Math.min(CFG.waterMax, CFG.waterBase + CFG.waterPerWin * wins);
  if (G.grace === 0) aliveWaters.forEach(w => {
    const n = nearest(w, aliveTrees);
    if (n && n.d < CFG.waterFear) { fleeStep(w, n.e, speed, dt); return; }
    const dx = fire.x - w.x, dy = fire.y - w.y, d = Math.hypot(dx, dy) || 1;
    let vx = dx / d, vy = dy / d;
    aliveWaters.forEach(o => { if (o !== w) { const ox = w.x - o.x, oy = w.y - o.y, od = Math.hypot(ox, oy); if (od > 0 && od < 36) { vx += ox / od * 0.8; vy += oy / od * 0.8; } } });
    const vl = Math.hypot(vx, vy) || 1, wb = bounds(w);
    w.x = clamp(w.x + vx / vl * speed * dt, wb.minX, wb.maxX); w.y = clamp(w.y + vy / vl * speed * dt, wb.minY, wb.maxY);
  });

  // Kollisionen: Baum tötet Wasser, Feuer zerstört Baum, Wasser tötet Feuer
  aliveWaters.forEach(w => { if (aliveTrees.some(t => touching(t, w))) { w.dead = true; w.t = 0; } });
  aliveTrees.forEach(t => { if (touching(fire, t)) { t.dead = true; t.t = 0; } });
  if (G.waters.some(w => !w.dead && touching(fire, w))) { updateHud(); return endRound("lost"); }

  const treesLeft = G.trees.filter(t => !t.dead).length, watersLeft = G.waters.filter(w => !w.dead).length;
  updateHud();
  if (treesLeft === 0 && watersLeft === 0) endRound("won");
  else if (treesLeft === 0) endRound("noTrees");
}

(async function main() {
  await Promise.all(Object.values(KINDS).map(loadKind));
  fitCamera(); window.addEventListener("resize", () => { applyResolution(); engine.resize(); fitCamera(); });
  resetGame();
  scene.onBeforeRenderObservable.add(() => {
    update(Math.min(engine.getDeltaTime() / 1000, 0.05));
    [G.fire, ...G.trees, ...G.waters].forEach(e => render(e, G.time));
  });
  engine.runRenderLoop(() => scene.render());
  canvas.focus();
  window.__game = { G, CFG, KINDS, keys, resetGame, body, touching, get wins() { return wins; } };
})();
</script>
