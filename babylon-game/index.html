<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Feuer gegen Wasser</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14161c; }
  #c { width: 100vw; height: 100vh; display: block; outline: none; touch-action: none; }
  .ui { position: fixed; color: #e6ebf5; font: 15px/1.4 system-ui, sans-serif; pointer-events: none; }
  #top { top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
  #top span { background: rgba(20,22,28,.72); padding: 7px 14px; border-radius: 10px; white-space: nowrap; }
  #top b { color: #fff; font-size: 18px; }
  #hint { left: 14px; bottom: 12px; background: rgba(20,22,28,.65); padding: 8px 12px; border-radius: 8px; max-width: 46ch; font-size: 13px; }
  #hint b { color: #fff; }
  #msg { inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; text-align: center; background: rgba(10,12,18,.55); }
  #msg.show { display: flex; }
  #msg h1 { margin: 0 0 8px; font-size: clamp(30px, 6vw, 64px); }
  #msg p { margin: 0; font-size: clamp(16px, 2.4vw, 26px); opacity: .9; }
  #msg.win h1 { color: #ffd54a; } #msg.lose h1 { color: #ff6b5e; }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="top" class="ui"><span>🏆 Siege: <b id="wins">0</b></span><span>🌳 Bäume: <b id="trees">0</b></span><span>💧 Wasser: <b id="waters">0</b></span></div>
<div id="hint" class="ui"><b>Pfeiltasten</b> / <b>WASD</b>: Feuer bewegen · <b>F</b>: Vollbild<br>Bäume fliehen vor dir und zerstören sich, wenn du sie berührst. Sonst jagen sie das Wasser, und das Wasser flieht vor ihnen. Wenn dich Wasser berührt, startet das Spiel neu.</div>
<div id="msg" class="ui"><h1 id="msgTitle"></h1><p id="msgSub"></p></div>
<script src="babylon.js"></script>
<script src="js/assets.js"></script>
<script src="js/config.js"></script>
<script src="js/sim/world.js"></script>
<script src="js/sim/tree-ai.js"></script>
<script src="js/sim/water-ai.js"></script>
<script src="js/view/stage.js"></script>
<script src="js/view/sprites.js"></script>
<script src="js/main.js"></script>
</body>
</html>
